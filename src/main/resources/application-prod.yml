spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: create

custom:
  jwt:
    secret-key: ${JWT_SECRET}
    expire-seconds: ${JWT_EXPIRATION}
    refresh-expire-seconds: ${REFRESH_TOKEN_EXPIRATION}
  cookie:
    secure: true
    same-site: Lax
  claude:
    api-key: ${CLAUDE_API_KEY}
    model: claude-sonnet-5
    max-tokens: 1024
  admin:
    username: ${ADMIN_USERNAME}
    password: ${ADMIN_PASSWORD}
    email: ${ADMIN_EMAIL}
    phone-num: ${ADMIN_PHONE_NUM}
    name: ${ADMIN_NAME:관리자}
    region: ${ADMIN_REGION:서울}
